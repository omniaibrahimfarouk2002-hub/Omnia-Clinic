<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnia Clinic | Mansoura</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
function App() {
  const [cart, setCart] = useState({});
  const [filter, setFilter] = useState('All');
  const [search, setSearch] = useState('');
  const [fav, setFav] = useState([]);
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [promo, setPromo] = useState('');
  const [dark, setDark] = useState(false);

  const services = [
    { id:1, name:"General Checkup", cat:"General", price:200, img:"https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=400", desc:"Full body checkup + report" },
    { id:2, name:"Dental Cleaning", cat:"Dental", price:350, img:"https://images.unsplash.com/photo-1606811841689-23dfddce3e95?w=400", desc:"Cleaning + polishing" },
    { id:3, name:"Teeth Whitening", cat:"Dental", price:800, img:"https://images.unsplash.com/photo-1609840114035-3c981b782dfe?w=400", desc:"Laser whitening session" },
    { id:4, name:"Skin Care Session", cat:"Skin", price:450, img:"https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=400", desc:"Facial + skin analysis" },
    { id:5, name:"Laser Hair Removal", cat:"Skin", price:600, img:"https://images.unsplash.com/photo-1512290923902-8a9f81dc236c?w=400", desc:"One session - full body" },
    { id:6, name:"Kids Checkup", cat:"Kids", price:180, img:"https://images.unsplash.com/photo-1631217868264-e5b90bb7e133?w=400", desc:"Pediatric checkup" },
  ];

  const filtered = services.filter(m => (filter==='All' || m.cat===filter) && m.name.toLowerCase().includes(search.toLowerCase()));
  const totalItems = Object.values(cart).reduce((a,b)=>a+b,0);
  let subtotal = Object.entries(cart).reduce((sum,[id,qty]) => sum + services.find(m=>m.id==id).price*qty, 0);
  let discount = promo==='OMNIA10' ? subtotal*0.1 : 0;
  let fee = subtotal>0 ? 30 : 0;
  let total = subtotal - discount + fee;

  const changeQty = (id, delta) => {
    setCart(prev => {
      let n = {...prev};
      n[id] = (n[id]||0)+delta;
      if(n[id]<=0) delete n[id];
      return n;
    });
  };
  const toggleFav = (id) => setFav(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);

  const order = () => {
    let msg = `Hello Omnia Clinic - Mansoura%0AName: ${name}%0APhone: ${phone}%0A%0A`;
    Object.entries(cart).forEach(([id,qty])=>{ let it=services.find(m=>m.id==id); msg+=`${it.name} x${qty} = ${it.price*qty} EGP%0A`; });
    msg+=`%0ADiscount: ${discount} - Booking Fee: ${fee}%0ATotal: ${total} EGP`;
    window.open(`https://wa.me/201068348772?text=${msg}`,'_blank');
  };

  return (
    <div className={dark ? "min-h-screen bg-gray-900 text-white pb-10" : "min-h-screen bg-teal-50 pb-10"}>
      <div className="bg-teal-600 text-white p-6 text-center rounded-b-3xl">
        <h1 className="text-3xl font-bold">Omnia Clinic 🩺</h1>
        <p>Mansoura, Dakahlia | 01068348772</p>
        <button onClick={()=>setDark(!dark)} className="bg-black/20 px-4 py-1 rounded-full mt-2 text-sm">{dark ? "☀️ Light" : "🌙 Dark"}</button>
      </div>

      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search for a service..." className="block w-[90%] max-w-3xl mx-auto mt-4 p-3 rounded-xl border text-black" />

      <div className="flex gap-2 justify-center mt-3 flex-wrap px-4">
        {['All','General','Dental','Skin','Kids'].map(c=>(
          <button key={c} onClick={()=>setFilter(c)} className={filter===c ? "bg-teal-600 text-white px-4 py-2 rounded-full font-bold" : "bg-white text-black px-4 py-2 rounded-full shadow"}>{c}</button>
        ))}
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 max-w-3xl mx-auto">
        {filtered.map(item=>(
          <div key={item.id} className="bg-white text-black rounded-2xl shadow overflow-hidden">
            <img src={item.img} className="w-full h-40 object-cover" />
            <div className="p-4 flex justify-between items-start">
              <div>
                <h2 className="font-bold text-lg">{item.name} <button onClick={()=>toggleFav(item.id)}>{fav.includes(item.id) ? "❤️" : "🤍"}</button></h2>
                <p className="text-gray-500 text-sm">{item.desc}</p>
                <p className="font-bold text-teal-600">{item.price} EGP</p>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={()=>changeQty(item.id,1)} className="bg-teal-600 text-white w-8 h-8 rounded-full font-bold">+</button>
                <span className="font-bold">{cart[item.id]||0}</span>
                <button onClick={()=>changeQty(item.id,-1)} className="bg-gray-200 w-8 h-8 rounded-full font-bold">-</button>
              </div>
            </div>
          </div>
        ))}
      </div>

      <div className="bg-white text-black p-4 rounded-2xl shadow max-w-3xl mx-auto mx-4 md:mx-auto">
        <h2 className="font-bold text-xl text-center">🛒 Your Booking: {totalItems} service</h2>
        {Object.entries(cart).map(([id,qty])=>{ let it=services.find(m=>m.id==id); return <p key={id} className="text-center text-sm">{it.name} x{qty} = {it.price*qty} EGP <button onClick={()=>changeQty(id,-qty)} className="text-red-500">❌</button></p> })}
        <p className="text-center mt-2">Subtotal: {subtotal} | Discount: {discount} | Booking Fee: {fee} | <b>Total: {total} EGP</b></p>
        <input value={promo} onChange={e=>setPromo(e.target.value)} placeholder="Promo code - try OMNIA10" className="w-full border p-3 rounded-xl mt-2" />
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" className="w-full border p-3 rounded-xl mt-2" />
        <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Your phone number" className="w-full border p-3 rounded-xl mt-2" />
        <button onClick={order} className="w-full bg-green-500 text-white py-3 rounded-xl font-bold mt-3">Book on WhatsApp 📲 - {total} EGP</button>
      </div>
      <p className="text-center text-xs text-gray-400 mt-8">This is a Demo Project by Omnia Ibrahim - Mansoura, Dakahlia<br/>For Portfolio | WhatsApp: 01068348772</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
